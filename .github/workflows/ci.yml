name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
      - run: uv sync --locked
        working-directory: apps/ai
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: pnpm install --frozen-lockfile
      - run: node ../../scripts/forge.mjs install foundry-rs/forge-std --no-commit
        working-directory: apps/web3
      - run: node ../../scripts/forge.mjs install OpenZeppelin/openzeppelin-contracts --no-commit
        working-directory: apps/web3
      - run: node ../../scripts/forge.mjs build
        working-directory: apps/web3
      - run: pnpm generate:abi
      - run: pnpm format:check
      - run: pnpm turbo run lint --filter='!@metron/ui' --filter='!@metron/web' --filter='!@metron/ai'
      - run: pnpm turbo run typecheck --filter='!@metron/ui' --filter='!@metron/web' --filter='!@metron/ai'
      - run: pnpm turbo run test --filter='!@metron/ui' --filter='!@metron/web' --filter='!@metron/ai'
      - run: pnpm turbo run build --filter='!@metron/ui' --filter='!@metron/web' --filter='!@metron/ai'
      - run: pnpm check:abi

  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
      - run: uv sync --locked
        working-directory: apps/ai
      - run: uv run ruff check src tests
        working-directory: apps/ai
      - run: uv run mypy
        working-directory: apps/ai
      - run: uv run pytest
        working-directory: apps/ai

  solidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: node ../../scripts/forge.mjs install foundry-rs/forge-std --no-commit
        working-directory: apps/web3
      - run: node ../../scripts/forge.mjs install OpenZeppelin/openzeppelin-contracts --no-commit
        working-directory: apps/web3
      - run: node ../../scripts/forge.mjs build
        working-directory: apps/web3
      - run: node ../../scripts/forge.mjs test
        working-directory: apps/web3
      - run: node ../../scripts/forge.mjs fmt --check
        working-directory: apps/web3

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
