[project]
name = "metron-ai"
version = "0.1.0"
description = "Advisory risk, optimization, and simulation service for Metron"
requires-python = ">=3.12"
dependencies = [
  "faker>=37,<38",
  "fastapi>=0.135,<1",
  "httpx>=0.28,<1",
  "numpy>=2.4,<3",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.13,<3",
  "scikit-learn>=1.8,<2",
  "scipy>=1.17,<2",
  "structlog>=25.5,<26",
  "uvicorn[standard]>=0.42,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.19,<2",
  "pytest>=9.0,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.15,<1",
]

[project.optional-dependencies]
ml = ["xgboost>=3.2,<4"]

[build-system]
requires = ["hatchling>=1.29,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metron_ai"]

[project.scripts]
metron-generate-dataset = "metron_ai.dataset_cli:main"
metron-train-models = "metron_ai.training_cli:main"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["metron_ai"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*"]
ignore_missing_imports = true
